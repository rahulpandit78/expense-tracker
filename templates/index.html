<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>Expense Tracker</h1>

    <!-- Monthly summary -->
    <section class="card">
      <div class="row space-between">
        <h2>Monthly summary</h2>
        <input type="month" id="month">
      </div>
      <p class="total">Total: ₹<span id="total">0.00</span></p>
      <ul id="by-category" class="chips"></ul>
    </section>

    <!-- Add / edit form -->
    <section class="card">
      <h2 id="form-title">Add expense</h2>
      <form id="expense-form">
        <input type="hidden" id="expense-id">
        <input type="number" id="amount" placeholder="Amount" step="0.01" min="0.01" required>
        <select id="category" required></select>
        <input type="date" id="date" required>
        <input type="text" id="note" placeholder="Note (optional)" maxlength="200">
        <button type="submit" id="submit-btn">Add</button>
        <button type="button" id="cancel-btn" class="secondary hidden">Cancel</button>
      </form>
      <p id="error" class="error"></p>
    </section>

    <!-- List with filter -->
    <section class="card">
      <div class="row space-between">
        <h2>Expenses</h2>
        <select id="filter-category"><option value="">All categories</option></select>
      </div>
      <table>
        <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody id="expense-list"></tbody>
      </table>
      <p id="empty" class="muted hidden">No expenses for this month yet.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
